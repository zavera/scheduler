<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1"/>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <meta http-equiv="cache-control" content="no-cache"/>
  <title>Scheduler — Report Assistant</title>

  <link href="css/global.css" rel="stylesheet" type="text/css"/>
  <link href="css/last-word.css" rel="stylesheet" type="text/css"/>
  <link href="css/chatbot.css" rel="stylesheet" type="text/css"/>

  <script type="text/javascript" src="js/lib/jquery.min-3.4.0.js"></script>
  <script src="js/util/util.js" type="text/javascript"></script>
  <script src="js/util/global2.js" type="text/javascript"></script>
  <script src="js/util/breadcrumbs.js" type="text/javascript"></script>
  <script src="js/common/feedback_screen.js" type="text/javascript"></script>
  <script src="js/chatbot/chatbot.js" type="text/javascript"></script>

  <script type="text/javascript">
    $(document).ready(function () {
      $("#fullHeader").load("header.html", function () {
        $('.chatbotlink').addClass('active');
        app_runIdleTimer();
        initFooter();
        eraseLicense();
        ChatBot.init();
      });
    });
  </script>
</head>

<body onMouseMove="app_handleMouseMove()">
<div class="wrapperSize">

  <div id="fullHeader"></div>
  <div class="breadcrumbs"></div>

  <div class="mainBody">
    <div id="chatbot-container">

      <div id="chatbot-header">
        <h3>Report Assistant</h3>
        <p>Ask questions about studies, subjects, appointments, and resources in plain English.</p>
        <div id="chatbot-examples">
          <span class="example-chip" onclick="ChatBot.sendExample(this)">How many active studies are open?</span>
          <span class="example-chip" onclick="ChatBot.sendExample(this)">Show all cancellations this month</span>
          <span class="example-chip" onclick="ChatBot.sendExample(this)">Which subjects have appointments next week?</span>
          <span class="example-chip" onclick="ChatBot.sendExample(this)">List studies by principal investigator</span>
          <span class="example-chip" onclick="ChatBot.sendExample(this)">How many visits were checked out today?</span>
        </div>
      </div>

      <div id="chatbot-messages" aria-live="polite"></div>

      <div id="chatbot-input-area">
        <textarea
          id="chatbot-input"
          placeholder="Ask anything about the scheduling data..."
          rows="2"
          onkeydown="ChatBot.handleKey(event)"
        ></textarea>
        <button id="chatbot-send-btn" onclick="ChatBot.send()">Send</button>
        <button id="chatbot-clear-btn" onclick="ChatBot.clear()" title="Clear conversation">&#x21BA;</button>
      </div>

    </div>
  </div>

  <div id="footer"></div>
</div>
</body>
</html>
